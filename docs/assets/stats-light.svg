<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-labelledby="title desc">
<title id="title">Results at a glance</title>
<desc id="desc">100% of walking windows flagged MOTION (hw5 recording, 2,621 windows). 94% of empty-room windows read EMPTY (hw5 validation recording). About 16,000 subcarrier amplitudes analysed per second (4 links × 114 subcarriers). 447 automated tests, no hardware needed, CI on every PR. 240 links from 16 pucks, since every puck sends and receives and links grow as n(n−1).</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
</style>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfcfd"/><stop offset="1" stop-color="#edf3f7"/></linearGradient></defs>
<rect x="1" y="1" width="1278" height="168" rx="16" fill="url(#card)" stroke="#d0d7de" stroke-width="2"/>
<rect x="42" y="28" width="22" height="3" rx="1.5" fill="#08717d"/>
<text x="40" y="82" font-size="48" font-weight="600" fill="#1f2328">100%<tspan class="m" dx="10" font-size="17" font-weight="700" fill="#a64300" letter-spacing="0.5">MOTION</tspan></text>
<text x="42" y="112" font-size="18" fill="#1f2328">of walking windows</text>
<text x="42" y="138" font-size="17" fill="#59636e">hw5 · 2,621 windows</text>
