<text x="288" y="82" font-size="48" font-weight="600" fill="#1f2328">94%<tspan class="m" dx="10" font-size="17" font-weight="700" fill="#08717d" letter-spacing="0.5">EMPTY</tspan></text>
<text x="290" y="112" font-size="18" fill="#1f2328">of empty-room windows</text>
<text x="290" y="138" font-size="17" fill="#59636e">hw5 validation recording</text>
<path d="M516 30V140" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="538" y="28" width="22" height="3" rx="1.5" fill="#08717d"/>
<text x="536" y="82" font-size="48" font-weight="600" fill="#1f2328">~16k<tspan font-size="30" font-weight="500" fill="#59636e">/s</tspan></text>
<text x="538" y="112" font-size="18" fill="#1f2328">amplitudes analysed</text>
<text x="538" y="138" font-size="17" fill="#59636e">4 links × 114 subcarriers</text>
