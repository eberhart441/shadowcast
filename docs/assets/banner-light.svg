<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title desc">
<title id="title">Device-free motion sensing from WiFi CSI</title>
<desc id="desc">Team 12, CodeMetalForge Hackathon. Every radio link is a motion sensor. ESP32-C5, 114 subcarriers, 40 Hz, RF tomography. Schematic of the 2.77 m by 1.84 m rig: receivers rx2 and rx1 in the top corners, senders tx1 and tx0 in the bottom corners, four links between them, and a heat blob for a person walking through the room.</desc>
