name: ci

on:
  pull_request:
  push:
    branches: [main]

# One run per branch or PR at a time: a new push cancels the superseded run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Test (full suite, parallel)
        run: python -m pytest -q -n auto

  node-core:
    # Portable C cores of the node firmware (firmware/core), built and run on the PC with gcc, plain and with
    # AddressSanitizer + UndefinedBehaviorSanitizer.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build and test (gcc)
        run: CC=gcc bash firmware/core/test.sh

      - name: Build and test (gcc, sanitizers)
        run: CC=gcc EXTRA_CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" bash firmware/core/test.sh
