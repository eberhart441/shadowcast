[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csi"
version = "0.1.0"
description = "WiFi CSI presence/motion/breathing detection from ESP32 nodes"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["csi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
